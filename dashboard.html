<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script 
    type="module"
    src="assets/js/main.js"
    ></script>
</head>
<body>
    <header class="app-header">
        <div class="container header-container">
            <div class="header-top">
                <div class="header-brand">
                    <h1>Manajemen Lahan &amp; Tanaman</h1>
                    <p class="subtitle">UTS Dasar Pemrograman Frontend</p>
                </div>
                <button class="nav-toggle" type="button" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="app-nav">☰</button>
            </div>
            <nav class="app-nav" id="app-nav" aria-label="Menu utama">
                <ul class="nav-menu">
                    <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
                    <li><a href="data-lahan.html">Lahan</a></li>
                    <li><a href="data-tanaman.html">Tanaman</a></li>
                    <li><a href="card.html">Kartu Lahan &amp; Tanaman</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="container main-content">
        <section id="dashboard" class="card" aria-labelledby="dashboard-title">
            <h2 id="dashboard-title">Dashboard</h2>
            <p class="section-desc" id="welcome-text"></p>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="stat-total-lahan">0</span>
                    <span class="stat-label">Total Lahan</span>
                </div>

                <div class="stat-card">
                    <span class="stat-value" id="stat-total-luas">0</span>
                    <span class="stat-label">Total Luas</span>
                </div>

                <div class="stat-card">
                    <span class="stat-value" id="stat-total-tanaman">0</span>
                    <span class="stat-label">Total Tanaman</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 STIKOM PGRI Banyuwangi — Sistem Manajemen Data Lahan &amp; Tanaman. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
